<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const saved = localStorage.getItem('portfolio-theme')
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Chetan Senta, a Computer Engineering student building dependable web products and developer tools." />
    <meta property="og:title" content="Chetan Senta | Portfolio" />
    <meta property="og:description" content="Dependable web products and thoughtful engineering." />
    <meta property="og:type" content="website" />
    <title>Chetan Senta | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
